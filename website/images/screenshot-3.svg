<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bg3" x1="0" y1="0" x2="1200" y2="800" gradientUnits="userSpaceOnUse">
            <stop stop-color="#FAFAFA"/>
            <stop offset="1" stop-color="#F4F4F5"/>
        </linearGradient>
        <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="8" stdDeviation="16" flood-opacity="0.12"/>
        </filter>
    </defs>

    <rect width="1200" height="800" fill="url(#bg3)"/>

    <!-- Main Window -->
    <g filter="url(#shadow3)">
        <rect x="80" y="40" width="1040" height="720" rx="12" fill="white"/>

        <!-- Title Bar -->
        <rect x="80" y="40" width="1040" height="44" rx="12" fill="#FAFAFA"/>
        <rect x="80" y="72" width="1040" height="12" fill="#FAFAFA"/>
        <circle cx="106" cy="62" r="6" fill="#FF5F56"/>
        <circle cx="126" cy="62" r="6" fill="#FFBD2E"/>
        <circle cx="146" cy="62" r="6" fill="#27CA40"/>
        <text x="600" y="67" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#71717A" text-anchor="middle">SortMeOut — Settings</text>

        <!-- Sidebar Navigation -->
        <rect x="80" y="84" width="200" height="676" fill="#FAFAFA"/>

        <rect x="96" y="104" width="168" height="40" rx="6" fill="#6366F1"/>
        <text x="120" y="130" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="white">⚙️ General</text>

        <text x="120" y="176" font-family="Inter, sans-serif" font-size="13" fill="#52525B">📁 Folders</text>
        <text x="120" y="216" font-family="Inter, sans-serif" font-size="13" fill="#52525B">📋 Rules</text>
        <text x="120" y="256" font-family="Inter, sans-serif" font-size="13" fill="#52525B">🔔 Notifications</text>
        <text x="120" y="296" font-family="Inter, sans-serif" font-size="13" fill="#52525B">⌨️ Shortcuts</text>
        <text x="120" y="336" font-family="Inter, sans-serif" font-size="13" fill="#52525B">🔐 Privacy</text>
        <text x="120" y="376" font-family="Inter, sans-serif" font-size="13" fill="#52525B">ℹ️ About</text>

        <!-- Main Content -->
        <text x="320" y="120" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#18181B">General Settings</text>

        <!-- Settings Sections -->
        <text x="320" y="170" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#71717A">STARTUP</text>

        <rect x="320" y="185" width="760" height="100" rx="8" fill="#FAFAFA"/>

        <text x="340" y="220" font-family="Inter, sans-serif" font-size="14" fill="#18181B">Launch at login</text>
        <text x="340" y="240" font-family="Inter, sans-serif" font-size="12" fill="#71717A">Start SortMeOut automatically when you log in</text>
        <rect x="1020" y="210" width="44" height="24" rx="12" fill="#6366F1"/>
        <circle cx="1052" cy="222" r="10" fill="white"/>

        <text x="340" y="270" font-family="Inter, sans-serif" font-size="14" fill="#18181B">Start minimized</text>
        <rect x="1020" y="255" width="44" height="24" rx="12" fill="#E4E4E7"/>
        <circle cx="1032" cy="267" r="10" fill="white"/>

        <!-- Monitoring Section -->
        <text x="320" y="320" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#71717A">FILE MONITORING</text>

        <rect x="320" y="335" width="760" height="150" rx="8" fill="#FAFAFA"/>

        <text x="340" y="370" font-family="Inter, sans-serif" font-size="14" fill="#18181B">Scan interval</text>
        <text x="340" y="390" font-family="Inter, sans-serif" font-size="12" fill="#71717A">How often to check for new files</text>
        <rect x="950" y="355" width="115" height="36" rx="6" fill="white" stroke="#E4E4E7"/>
        <text x="970" y="380" font-family="Inter, sans-serif" font-size="13" fill="#18181B">5 seconds</text>

        <text x="340" y="425" font-family="Inter, sans-serif" font-size="14" fill="#18181B">Process hidden files</text>
        <text x="340" y="445" font-family="Inter, sans-serif" font-size="12" fill="#71717A">Include files starting with a dot (.file)</text>
        <rect x="1020" y="415" width="44" height="24" rx="12" fill="#E4E4E7"/>
        <circle cx="1032" cy="427" r="10" fill="white"/>

        <text x="340" y="475" font-family="Inter, sans-serif" font-size="14" fill="#18181B">Confirm before destructive actions</text>
        <rect x="1020" y="460" width="44" height="24" rx="12" fill="#6366F1"/>
        <circle cx="1052" cy="472" r="10" fill="white"/>

        <!-- Trash Section -->
        <text x="320" y="525" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#71717A">TRASH MANAGEMENT</text>

        <rect x="320" y="540" width="760" height="100" rx="8" fill="#FAFAFA"/>

        <text x="340" y="575" font-family="Inter, sans-serif" font-size="14" fill="#18181B">Auto-empty trash after</text>
        <text x="340" y="595" font-family="Inter, sans-serif" font-size="12" fill="#71717A">Automatically empty items moved by SortMeOut</text>
        <rect x="950" y="560" width="115" height="36" rx="6" fill="white" stroke="#E4E4E7"/>
        <text x="970" y="585" font-family="Inter, sans-serif" font-size="13" fill="#18181B">30 days</text>

        <text x="340" y="625" font-family="Inter, sans-serif" font-size="14" fill="#18181B">Use secure delete</text>
        <rect x="1020" y="610" width="44" height="24" rx="12" fill="#E4E4E7"/>
        <circle cx="1032" cy="622" r="10" fill="white"/>

        <!-- Logging Section -->
        <text x="320" y="680" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#71717A">LOGGING</text>

        <rect x="320" y="695" width="760" height="50" rx="8" fill="#FAFAFA"/>

        <text x="340" y="725" font-family="Inter, sans-serif" font-size="14" fill="#18181B">Enable detailed logging</text>
        <rect x="1020" y="710" width="44" height="24" rx="12" fill="#6366F1"/>
        <circle cx="1052" cy="722" r="10" fill="white"/>
    </g>
</svg>
