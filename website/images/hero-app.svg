<svg width="1200" height="750" viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bg-gradient" x1="0" y1="0" x2="1200" y2="750" gradientUnits="userSpaceOnUse">
            <stop stop-color="#F9FAFB"/>
            <stop offset="1" stop-color="#F3F4F6"/>
        </linearGradient>
        <linearGradient id="accent-gradient" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
            <stop stop-color="#6366F1"/>
            <stop offset="1" stop-color="#8B5CF6"/>
        </linearGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="10" stdDeviation="20" flood-opacity="0.15"/>
        </filter>
    </defs>

    <!-- Background -->
    <rect width="1200" height="750" fill="url(#bg-gradient)"/>

    <!-- Main Window -->
    <g filter="url(#shadow)">
        <rect x="100" y="50" width="1000" height="650" rx="12" fill="white"/>

        <!-- Title Bar -->
        <rect x="100" y="50" width="1000" height="48" rx="12" fill="#F9FAFB"/>
        <rect x="100" y="86" width="1000" height="12" fill="#F9FAFB"/>

        <!-- Traffic Lights -->
        <circle cx="128" cy="74" r="6" fill="#FF5F56"/>
        <circle cx="148" cy="74" r="6" fill="#FFBD2E"/>
        <circle cx="168" cy="74" r="6" fill="#27CA40"/>

        <!-- Title -->
        <text x="600" y="79" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#6B7280" text-anchor="middle">SortMeOut</text>

        <!-- Sidebar -->
        <rect x="100" y="98" width="240" height="602" fill="#F9FAFB"/>

        <!-- Sidebar Items -->
        <rect x="116" y="118" width="208" height="40" rx="8" fill="url(#accent-gradient)"/>
        <text x="150" y="144" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" fill="white">📁 Downloads</text>

        <text x="150" y="188" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" fill="#4B5563">📁 Documents</text>
        <text x="150" y="228" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" fill="#4B5563">📁 Desktop</text>

        <text x="130" y="290" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#9CA3AF">RULES</text>
        <text x="150" y="320" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" fill="#4B5563">📋 Organize PDFs</text>
        <text x="150" y="356" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" fill="#4B5563">📋 Archive Images</text>
        <text x="150" y="392" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" fill="#4B5563">📋 Clean Downloads</text>

        <!-- Main Content -->
        <text x="380" y="140" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#111827">Downloads</text>
        <text x="380" y="164" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6B7280">3 rules active • 127 files processed today</text>

        <!-- Stats Cards -->
        <rect x="380" y="190" width="200" height="100" rx="12" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
        <text x="400" y="230" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" fill="#166534">127</text>
        <text x="400" y="260" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#15803D">Files Processed</text>

        <rect x="600" y="190" width="200" height="100" rx="12" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
        <text x="620" y="230" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" fill="#1E40AF">3</text>
        <text x="620" y="260" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#1D4ED8">Active Rules</text>

        <rect x="820" y="190" width="200" height="100" rx="12" fill="#FDF4FF" stroke="#E9D5FF" stroke-width="1"/>
        <text x="840" y="230" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" fill="#7E22CE">2.4 GB</text>
        <text x="840" y="260" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#9333EA">Space Saved</text>

        <!-- Recent Activity -->
        <text x="380" y="340" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#111827">Recent Activity</text>

        <!-- Activity Items -->
        <g>
            <rect x="380" y="360" width="700" height="60" rx="8" fill="#F9FAFB"/>
            <circle cx="410" cy="390" r="16" fill="#DCFCE7"/>
            <text x="410" y="395" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#166534" text-anchor="middle">✓</text>
            <text x="440" y="385" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" fill="#111827">invoice_2024.pdf moved to Documents/Invoices</text>
            <text x="440" y="405" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">2 minutes ago • Rule: Organize PDFs</text>
        </g>

        <g>
            <rect x="380" y="430" width="700" height="60" rx="8" fill="#F9FAFB"/>
            <circle cx="410" cy="460" r="16" fill="#DCFCE7"/>
            <text x="410" y="465" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#166534" text-anchor="middle">✓</text>
            <text x="440" y="455" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" fill="#111827">screenshot_2024.png archived</text>
            <text x="440" y="475" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">5 minutes ago • Rule: Archive Images</text>
        </g>

        <g>
            <rect x="380" y="500" width="700" height="60" rx="8" fill="#F9FAFB"/>
            <circle cx="410" cy="530" r="16" fill="#DCFCE7"/>
            <text x="410" y="535" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#166534" text-anchor="middle">✓</text>
            <text x="440" y="525" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" fill="#111827">report_Q4.xlsx moved to Documents/Reports</text>
            <text x="440" y="545" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6B7280">10 minutes ago • Rule: Sort Spreadsheets</text>
        </g>

        <!-- Status Bar -->
        <rect x="100" y="680" width="1000" height="20" fill="#F9FAFB"/>
        <circle cx="120" cy="690" r="4" fill="#22C55E"/>
        <text x="132" y="694" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">Monitoring active</text>
        <text x="1050" y="694" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280" text-anchor="end">v1.0.0</text>
    </g>
</svg>
