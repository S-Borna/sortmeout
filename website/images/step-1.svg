<svg width="400" height="320" viewBox="0 0 400 320" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="step1-bg" x1="0" y1="0" x2="400" y2="320" gradientUnits="userSpaceOnUse">
            <stop stop-color="#EEF2FF"/>
            <stop offset="1" stop-color="#E0E7FF"/>
        </linearGradient>
        <linearGradient id="step1-accent" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
            <stop stop-color="#6366F1"/>
            <stop offset="1" stop-color="#8B5CF6"/>
        </linearGradient>
    </defs>

    <!-- Background -->
    <rect width="400" height="320" rx="16" fill="url(#step1-bg)"/>

    <!-- Folder Icons -->
    <g transform="translate(50, 80)">
        <!-- Folder 1 -->
        <rect x="0" y="10" width="70" height="50" rx="4" fill="#A5B4FC"/>
        <rect x="0" y="0" width="30" height="12" rx="2" fill="#A5B4FC"/>
        <text x="35" y="42" font-family="Inter, sans-serif" font-size="24" text-anchor="middle">📁</text>
    </g>

    <g transform="translate(165, 60)">
        <!-- Folder 2 -->
        <rect x="0" y="10" width="70" height="50" rx="4" fill="#A5B4FC"/>
        <rect x="0" y="0" width="30" height="12" rx="2" fill="#A5B4FC"/>
        <text x="35" y="42" font-family="Inter, sans-serif" font-size="24" text-anchor="middle">📂</text>
    </g>

    <g transform="translate(280, 80)">
        <!-- Folder 3 -->
        <rect x="0" y="10" width="70" height="50" rx="4" fill="#A5B4FC"/>
        <rect x="0" y="0" width="30" height="12" rx="2" fill="#A5B4FC"/>
        <text x="35" y="42" font-family="Inter, sans-serif" font-size="24" text-anchor="middle">📁</text>
    </g>

    <!-- Plus button -->
    <g transform="translate(150, 180)">
        <circle cx="50" cy="30" r="35" fill="url(#step1-accent)"/>
        <rect x="38" y="22" width="24" height="4" rx="2" fill="white"/>
        <rect x="48" y="12" width="4" height="24" rx="2" fill="white"/>
    </g>

    <!-- Text -->
    <text x="200" y="280" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#4338CA" text-anchor="middle">Add Folders to Watch</text>
</svg>
