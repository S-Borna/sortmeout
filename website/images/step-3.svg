<svg width="400" height="320" viewBox="0 0 400 320" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="step3-bg" x1="0" y1="0" x2="400" y2="320" gradientUnits="userSpaceOnUse">
            <stop stop-color="#FDF4FF"/>
            <stop offset="1" stop-color="#FAE8FF"/>
        </linearGradient>
        <linearGradient id="step3-accent" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
            <stop stop-color="#A855F7"/>
            <stop offset="1" stop-color="#9333EA"/>
        </linearGradient>
    </defs>

    <!-- Background -->
    <rect width="400" height="320" rx="16" fill="url(#step3-bg)"/>

    <!-- File icons moving -->
    <g transform="translate(50, 100)">
        <!-- Files on left -->
        <rect x="0" y="0" width="50" height="60" rx="4" fill="#FCA5A5"/>
        <text x="25" y="38" font-family="Inter, sans-serif" font-size="20" text-anchor="middle">📄</text>

        <rect x="20" y="70" width="50" height="60" rx="4" fill="#93C5FD"/>
        <text x="45" y="108" font-family="Inter, sans-serif" font-size="20" text-anchor="middle">📊</text>
    </g>

    <!-- Arrows -->
    <g transform="translate(130, 120)">
        <path d="M0 30 L60 30" stroke="url(#step3-accent)" stroke-width="3" stroke-dasharray="6 4"/>
        <path d="M55 25 L65 30 L55 35" fill="url(#step3-accent)"/>
    </g>

    <!-- Magic sparkles -->
    <g transform="translate(180, 90)">
        <circle cx="20" cy="20" r="40" fill="url(#step3-accent)" opacity="0.2"/>
        <circle cx="20" cy="20" r="25" fill="url(#step3-accent)" opacity="0.4"/>
        <text x="20" y="28" font-family="Inter, sans-serif" font-size="28" text-anchor="middle">✨</text>
    </g>

    <!-- More arrows -->
    <g transform="translate(220, 120)">
        <path d="M0 30 L60 30" stroke="url(#step3-accent)" stroke-width="3" stroke-dasharray="6 4"/>
        <path d="M55 25 L65 30 L55 35" fill="url(#step3-accent)"/>
    </g>

    <!-- Organized folders on right -->
    <g transform="translate(290, 80)">
        <rect x="0" y="10" width="60" height="45" rx="4" fill="#86EFAC"/>
        <rect x="0" y="0" width="25" height="10" rx="2" fill="#86EFAC"/>
        <text x="30" y="40" font-family="Inter, sans-serif" font-size="18" text-anchor="middle">📁</text>
        <text x="30" y="75" font-family="Inter, sans-serif" font-size="10" fill="#166534">PDFs</text>

        <rect x="0" y="100" width="60" height="45" rx="4" fill="#7DD3FC"/>
        <rect x="0" y="90" width="25" height="10" rx="2" fill="#7DD3FC"/>
        <text x="30" y="130" font-family="Inter, sans-serif" font-size="18" text-anchor="middle">📁</text>
        <text x="30" y="165" font-family="Inter, sans-serif" font-size="10" fill="#0369A1">Spreadsheets</text>
    </g>

    <!-- Text -->
    <text x="200" y="290" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#7E22CE" text-anchor="middle">Watch It Work Automatically</text>
</svg>
