        <path d="M0 25 L0 85 Q0 95 10 95 L90 95 Q100 95 100 85 L100 25 Q100 15 90 15 L45 15 L35 5 L10 5 Q0 5 0 15 Z" fill="white" fill-opacity="0.9"/>

        <!-- Sorting arrow -->
