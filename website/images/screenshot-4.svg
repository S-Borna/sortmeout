<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bg4" x1="0" y1="0" x2="1200" y2="800" gradientUnits="userSpaceOnUse">
            <stop stop-color="#FAFAFA"/>
            <stop offset="1" stop-color="#F4F4F5"/>
        </linearGradient>
        <filter id="shadow4" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="8" stdDeviation="16" flood-opacity="0.12"/>
        </filter>
    </defs>

    <rect width="1200" height="800" fill="url(#bg4)"/>

    <!-- Menu Bar Icon Area -->
    <rect x="0" y="0" width="1200" height="32" fill="#2D2D2D"/>
    <text x="1100" y="22" font-family="Inter, sans-serif" font-size="14" fill="white">📂</text>

    <!-- Dropdown Menu -->
    <g filter="url(#shadow4)">
        <rect x="900" y="40" width="280" height="400" rx="12" fill="white"/>

        <!-- Header -->
        <rect x="900" y="40" width="280" height="60" rx="12" fill="#FAFAFA"/>
        <rect x="900" y="88" width="280" height="12" fill="#FAFAFA"/>

        <circle cx="940" cy="70" r="16" fill="#6366F1"/>
        <text x="940" y="77" font-family="Inter, sans-serif" font-size="18" fill="white" text-anchor="middle">📂</text>
        <text x="970" y="66" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#18181B">SortMeOut</text>
        <text x="970" y="84" font-family="Inter, sans-serif" font-size="11" fill="#22C55E">● Monitoring</text>

        <!-- Quick Stats -->
        <text x="920" y="130" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#A1A1AA">TODAY'S ACTIVITY</text>

        <rect x="920" y="145" width="110" height="55" rx="8" fill="#F0FDF4"/>
        <text x="935" y="175" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#166534">127</text>
        <text x="935" y="192" font-family="Inter, sans-serif" font-size="10" fill="#15803D">Files sorted</text>

        <rect x="1050" y="145" width="110" height="55" rx="8" fill="#EFF6FF"/>
        <text x="1065" y="175" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#1E40AF">3</text>
        <text x="1065" y="192" font-family="Inter, sans-serif" font-size="10" fill="#1D4ED8">Active rules</text>

        <!-- Recent Activity -->
        <text x="920" y="235" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#A1A1AA">RECENT</text>

        <g transform="translate(920, 248)">
            <rect width="240" height="36" rx="6" fill="#FAFAFA"/>
            <text x="10" y="14" font-family="Inter, sans-serif" font-size="10" fill="#22C55E">✓</text>
            <text x="28" y="14" font-family="Inter, sans-serif" font-size="11" fill="#18181B">invoice.pdf</text>
            <text x="28" y="28" font-family="Inter, sans-serif" font-size="9" fill="#71717A">Moved to Documents/PDFs</text>
        </g>

        <g transform="translate(920, 292)">
            <rect width="240" height="36" rx="6" fill="#FAFAFA"/>
            <text x="10" y="14" font-family="Inter, sans-serif" font-size="10" fill="#22C55E">✓</text>
            <text x="28" y="14" font-family="Inter, sans-serif" font-size="11" fill="#18181B">photo_001.jpg</text>
            <text x="28" y="28" font-family="Inter, sans-serif" font-size="9" fill="#71717A">Moved to Pictures/2024</text>
        </g>

        <!-- Divider -->
        <line x1="920" y1="345" x2="1160" y2="345" stroke="#E4E4E7"/>

        <!-- Menu Items -->
        <text x="920" y="375" font-family="Inter, sans-serif" font-size="13" fill="#18181B">⏸️  Pause Monitoring</text>
        <text x="920" y="405" font-family="Inter, sans-serif" font-size="13" fill="#18181B">⚙️  Open Settings...</text>
        <text x="920" y="430" font-family="Inter, sans-serif" font-size="13" fill="#71717A">⏻  Quit SortMeOut</text>
    </g>

    <!-- Desktop Background with Files -->
    <g transform="translate(80, 80)">
        <!-- Simulated Desktop -->
        <rect width="700" height="600" rx="12" fill="#E8E8E8"/>

        <!-- Files being organized - animated feel -->
        <g opacity="0.6">
            <rect x="50" y="100" width="80" height="100" rx="6" fill="white" stroke="#D4D4D8"/>
            <text x="90" y="170" font-family="Inter, sans-serif" font-size="28" text-anchor="middle">📄</text>
            <text x="90" y="192" font-family="Inter, sans-serif" font-size="9" fill="#52525B" text-anchor="middle">report.pdf</text>
        </g>

        <g opacity="0.4">
            <rect x="180" y="150" width="80" height="100" rx="6" fill="white" stroke="#D4D4D8"/>
            <text x="220" y="220" font-family="Inter, sans-serif" font-size="28" text-anchor="middle">🖼️</text>
            <text x="220" y="242" font-family="Inter, sans-serif" font-size="9" fill="#52525B" text-anchor="middle">photo.jpg</text>
        </g>

        <!-- Arrow showing movement -->
        <path d="M270 200 Q350 150 430 200" stroke="#6366F1" stroke-width="2" fill="none" stroke-dasharray="6 4"/>
        <polygon points="425,195 435,200 425,205" fill="#6366F1"/>

        <!-- Organized folders -->
        <g transform="translate(450, 100)">
            <rect width="90" height="70" rx="6" fill="#BFDBFE"/>
            <text x="45" y="45" font-family="Inter, sans-serif" font-size="28" text-anchor="middle">📁</text>
            <text x="45" y="90" font-family="Inter, sans-serif" font-size="10" fill="#1E40AF" text-anchor="middle">Documents</text>
        </g>

        <g transform="translate(560, 100)">
            <rect width="90" height="70" rx="6" fill="#BBF7D0"/>
            <text x="45" y="45" font-family="Inter, sans-serif" font-size="28" text-anchor="middle">📁</text>
            <text x="45" y="90" font-family="Inter, sans-serif" font-size="10" fill="#166534" text-anchor="middle">Pictures</text>
        </g>

        <!-- Success notification -->
        <g transform="translate(200, 380)">
            <rect width="300" height="60" rx="10" fill="white" filter="url(#shadow4)"/>
            <circle cx="35" cy="30" r="16" fill="#DCFCE7"/>
            <text x="35" y="37" font-family="Inter, sans-serif" font-size="16" fill="#166534" text-anchor="middle">✓</text>
            <text x="65" y="26" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#18181B">2 files organized</text>
            <text x="65" y="45" font-family="Inter, sans-serif" font-size="11" fill="#71717A">Moved to appropriate folders</text>
        </g>

        <!-- Dock -->
        <rect x="150" y="540" width="400" height="50" rx="12" fill="rgba(255,255,255,0.8)"/>
        <text x="200" y="575" font-family="Inter, sans-serif" font-size="28">🔍</text>
        <text x="260" y="575" font-family="Inter, sans-serif" font-size="28">📧</text>
        <text x="320" y="575" font-family="Inter, sans-serif" font-size="28">📂</text>
        <text x="380" y="575" font-family="Inter, sans-serif" font-size="28">⚙️</text>
        <text x="440" y="575" font-family="Inter, sans-serif" font-size="28">🗑️</text>
    </g>
</svg>
