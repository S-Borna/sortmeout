<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bg2" x1="0" y1="0" x2="1200" y2="800" gradientUnits="userSpaceOnUse">
            <stop stop-color="#FAFAFA"/>
            <stop offset="1" stop-color="#F4F4F5"/>
        </linearGradient>
        <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="8" stdDeviation="16" flood-opacity="0.12"/>
        </filter>
    </defs>

    <rect width="1200" height="800" fill="url(#bg2)"/>

    <!-- Main Window -->
    <g filter="url(#shadow2)">
        <rect x="80" y="40" width="1040" height="720" rx="12" fill="white"/>

        <!-- Title Bar -->
        <rect x="80" y="40" width="1040" height="44" rx="12" fill="#FAFAFA"/>
        <rect x="80" y="72" width="1040" height="12" fill="#FAFAFA"/>
        <circle cx="106" cy="62" r="6" fill="#FF5F56"/>
        <circle cx="126" cy="62" r="6" fill="#FFBD2E"/>
        <circle cx="146" cy="62" r="6" fill="#27CA40"/>
        <text x="600" y="67" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#71717A" text-anchor="middle">SortMeOut — Activity Log</text>

        <!-- Tabs -->
        <rect x="300" y="100" width="100" height="36" rx="6" fill="#6366F1"/>
        <text x="350" y="124" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="white" text-anchor="middle">All Activity</text>

        <text x="450" y="124" font-family="Inter, sans-serif" font-size="13" fill="#71717A">Moved</text>
        <text x="530" y="124" font-family="Inter, sans-serif" font-size="13" fill="#71717A">Renamed</text>
        <text x="620" y="124" font-family="Inter, sans-serif" font-size="13" fill="#71717A">Deleted</text>
        <text x="710" y="124" font-family="Inter, sans-serif" font-size="13" fill="#71717A">Errors</text>

        <!-- Stats Row -->
        <rect x="300" y="155" width="200" height="70" rx="8" fill="#F0FDF4"/>
        <text x="320" y="185" font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="#166534">1,247</text>
        <text x="320" y="210" font-family="Inter, sans-serif" font-size="12" fill="#15803D">Files processed today</text>

        <rect x="520" y="155" width="200" height="70" rx="8" fill="#EFF6FF"/>
        <text x="540" y="185" font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="#1E40AF">12</text>
        <text x="540" y="210" font-family="Inter, sans-serif" font-size="12" fill="#1D4ED8">Active rules</text>

        <rect x="740" y="155" width="200" height="70" rx="8" fill="#FDF4FF"/>
        <text x="760" y="185" font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="#7E22CE">5.2 GB</text>
        <text x="760" y="210" font-family="Inter, sans-serif" font-size="12" fill="#9333EA">Space reclaimed</text>

        <rect x="960" y="155" width="160" height="70" rx="8" fill="#FEF3C7"/>
        <text x="980" y="185" font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="#92400E">3</text>
        <text x="980" y="210" font-family="Inter, sans-serif" font-size="12" fill="#A16207">Warnings</text>

        <!-- Activity List -->
        <text x="300" y="270" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#18181B">Recent Activity</text>
        <text x="1080" y="270" font-family="Inter, sans-serif" font-size="12" fill="#6366F1" text-anchor="end">View all →</text>

        <!-- Activity Items -->
        <g transform="translate(300, 290)">
