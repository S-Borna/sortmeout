            <circle cx="25" cy="30" r="14" fill="#FEE2E2"/>
            <text x="25" y="36" font-family="Inter, sans-serif" font-size="14" fill="#DC2626" text-anchor="middle">🗑</text>
            <text x="55" y="24" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#18181B">installer_v2.3.dmg (1.2 GB)</text>
            <text x="55" y="44" font-family="Inter, sans-serif" font-size="11" fill="#71717A">Moved to Trash • Rule: Archive Old Files (>30 days)</text>
            <text x="790" y="34" font-family="Inter, sans-serif" font-size="11" fill="#A1A1AA" text-anchor="end">15 min ago</text>
        </g>

