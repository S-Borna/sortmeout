            <circle cx="25" cy="30" r="14" fill="#FDE68A"/>
            <text x="25" y="36" font-family="Inter, sans-serif" font-size="14" fill="#A16207" text-anchor="middle">⚠</text>
            <text x="55" y="24" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#18181B">project_backup.zip</text>
            <text x="55" y="44" font-family="Inter, sans-serif" font-size="11" fill="#71717A">Skipped - File locked by another application • Rule: Archive Projects</text>
            <text x="790" y="34" font-family="Inter, sans-serif" font-size="11" fill="#A1A1AA" text-anchor="end">22 min ago</text>
        </g>

        <g transform="translate(300, 640)">
            <rect width="820" height="60" rx="8" fill="#FAFAFA"/>
            <circle cx="25" cy="30" r="14" fill="#DCFCE7"/>
            <text x="25" y="36" font-family="Inter, sans-serif" font-size="14" fill="#166534" text-anchor="middle">✓</text>
            <text x="55" y="24" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#18181B">meeting_notes.md</text>
            <text x="55" y="44" font-family="Inter, sans-serif" font-size="11" fill="#71717A">Moved to ~/Documents/Notes • Rule: Sort Markdown</text>
            <text x="790" y="34" font-family="Inter, sans-serif" font-size="11" fill="#A1A1AA" text-anchor="end">30 min ago</text>
