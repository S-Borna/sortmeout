            <circle cx="25" cy="30" r="14" fill="#DBEAFE"/>
            <text x="25" y="36" font-family="Inter, sans-serif" font-size="14" fill="#1D4ED8" text-anchor="middle">↻</text>
            <text x="55" y="24" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#18181B">IMG_4521.png → screenshot_2024-01-15_14-32.png</text>
            <text x="55" y="44" font-family="Inter, sans-serif" font-size="11" fill="#71717A">Renamed • Rule: Clean Screenshots</text>
            <text x="790" y="34" font-family="Inter, sans-serif" font-size="11" fill="#A1A1AA" text-anchor="end">8 min ago</text>
        </g>

